name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Add WASM target
        run: rustup target add wasm32-unknown-unknown

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: Install Dioxus CLI
        run: cargo install dioxus-cli --locked

      - name: Build the extension
        run: ./build-extension.sh

      - name: Package extension
        run: |
          mkdir -p out
          (cd dist/public && zip -r "$GITHUB_WORKSPACE/out/yourlearning-editor-extension-${{ github.ref_name }}.zip" .)

      - name: Create draft release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "YourLearning Editor ${{ github.ref_name }}"
          body: |
            Download `yourlearning-editor-extension-${{ github.ref_name }}.zip`, unzip it, then load it in your browser:

            1. Go to `chrome://extensions`
            2. Enable Developer mode
            3. Click "Load unpacked" and select the unzipped folder
          draft: true
          prerelease: false
          files: out/*.zip
